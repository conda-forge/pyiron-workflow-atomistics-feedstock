{% set name = "pyiron-workflow-atomistics" %}
{% set pypi_name = "pyiron_workflow_atomistics" %}
{% set version = "0.2.3" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: 3f26227c1a1b76ff0c5ae5f95c3b23c61d7ee17126b804af90eb685843aca577

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - versioneer ==0.29
    - pip
  run:
    - python >={{ python_min }},<3.14
    - ase >=3.24.0,<3.30.0
    - flowrep >=0.6.0,<0.7.0
    - matplotlib-base >=3.1.0,<3.12.0
    - numpy >=1.23.5,<2.6.0
    - pandas >=1.3.0,<3.1.0
    - pyiron_snippets >=1.3.0,<2.0.0
    - pyiron_workflow >=0.19.0,<0.21.0
    - pymatgen >=2024.8.8,<2027.0.0
    - pyscal3 >=4.1.0,<4.2.0
    - scikit-learn >=1.0.0,<1.10.0
    - scipy >=1.17.1,<1.19.0
    - structuretoolkit ==0.0.48
    - tqdm >=4.68.0,<4.71.0

test:
  imports:
    - pyiron_workflow_atomistics
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pyiron/pyiron_workflow_atomistics
  summary: A pyiron-workflow module for atomistic simulation workflows
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ligerzero-ai
    - liamhuber
    - niklassiemer
